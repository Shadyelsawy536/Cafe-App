# HubDine store builds: change RESTAURANT_SLUG to the folder name under
# config/restaurants/ (for example: cafe or slice-house) when building another tenant.
# Configure the matching Android keystore and Apple provisioning profiles in Codemagic.
workflows:
  store-release:
    name: HubDine - Tenant Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - hubdine-upload-key
      vars:
        RESTAURANT_SLUG: slice-house
    scripts:
      - name: Validate selected restaurant
        script: |
          test -f "config/restaurants/$RESTAURANT_SLUG/restaurant.json" || {
            echo "Unknown RESTAURANT_SLUG: $RESTAURANT_SLUG"
            echo "Expected a folder under config/restaurants/"
            exit 1
          }
          echo "Building tenant: $RESTAURANT_SLUG"
      - name: Install Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle (AAB)
        script: dart run tool/hubdine_build.dart "$RESTAURANT_SLUG" appbundle --release
      - name: Prepare selected iOS app identity
        script: |
          python3 - <<'PY'
          import json, os
          slug = os.environ["RESTAURANT_SLUG"]
          path = f"config/restaurants/{slug}/restaurant.json"
          with open(path, encoding="utf-8") as f:
              cfg = json.load(f)
          with open("ios/Flutter/Restaurant.xcconfig", "w", encoding="utf-8") as f:
              f.write(f'// Generated for {slug} by Codemagic\n')
              f.write(f'APP_BUNDLE_ID={cfg["IOS_BUNDLE_ID"]}\n')
              f.write(f'APP_DISPLAY_NAME={cfg["APP_NAME"]}\n')
          print(f'Prepared iOS bundle ID: {cfg["IOS_BUNDLE_ID"]}')
          PY
      - name: Configure iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: dart run tool/hubdine_build.dart "$RESTAURANT_SLUG" ipa --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
