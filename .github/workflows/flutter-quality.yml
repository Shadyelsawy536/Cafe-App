name: Flutter checkout safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format checkout controller
        run: dart format lib/features/ordering/presentation/controllers/ordering_controller.dart

      - name: Commit formatter changes to this PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ordering/presentation/controllers/ordering_controller.dart
          if git diff --cached --quiet; then
            echo "Controller is already formatted"
            exit 0
          fi
          git commit -m "style: format checkout controller"
          git push

      - name: Analyze Flutter project
        run: flutter analyze
