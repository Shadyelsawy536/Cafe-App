name: Flutter checkout safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/features/ordering/presentation/controllers/ordering_controller.dart

      - name: Analyze Flutter project
        run: flutter analyze
